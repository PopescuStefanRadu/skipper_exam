name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The Android emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: make setup
      - run: make test-all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-runs
          path: test-runs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: always()
        run: make down

  # After a merge to main passes, publish the images deploy/compose.yaml runs,
  # tagged latest and with the commit sha.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and push images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          prefix=ghcr.io/popescustefanradu/skipper-exam
          for image in app:. kratos:docker/kratos backup:docker/backup; do
            name=${image%%:*} context=${image#*:}
            docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              -t "$prefix-$name:${{ github.sha }}" -t "$prefix-$name:latest" "$context"
            docker push --all-tags "$prefix-$name"
          done
