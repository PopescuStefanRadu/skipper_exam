# The full local stack. Start it through scripts/stack.sh (or make up), which gives
# every worktree its own project name, so stacks never share containers or data.
# Host ports are assigned by Docker at start-up; nothing uses a fixed port.
services:
  db:
    image: postgres:17.2
    environment:
      POSTGRES_USER: skipper_exam
      POSTGRES_PASSWORD: skipper_exam
      POSTGRES_DB: skipper_exam
    ports:
      - "127.0.0.1::5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skipper_exam"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://skipper_exam:skipper_exam@db:5432/skipper_exam
    ports:
      - "127.0.0.1::8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  db:
