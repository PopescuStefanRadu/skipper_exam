# The full local stack. Start it through scripts/stack.sh (or make up), which gives
# every worktree its own project name, so stacks never share containers or data.
#
# Host ports are assigned by Docker at start-up, except the app's and the mock
# Google server's: Kratos must know both addresses before it starts, so stack.sh
# reserves free ports under a lock shared by all worktrees and passes them in as
# APP_PORT and MOCK_OIDC_PORT.
services:
  db:
    image: postgres:17.2
    environment:
      POSTGRES_USER: skipper_exam
      POSTGRES_PASSWORD: skipper_exam
      POSTGRES_DB: skipper_exam
    ports:
      - "127.0.0.1::5432"
    volumes:
      - db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skipper_exam"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Kratos with this app's configuration (docker/kratos), set from the environment
  # as in production; KRATOS_DEV allows plain http on 127.0.0.1.
  kratos-migrate:
    build: docker/kratos
    command: migrate
    environment: &kratos-env
      DSN: postgres://skipper_exam:skipper_exam@db:5432/kratos?sslmode=disable
      APP_URL: "${APP_URL:?set by scripts/stack.sh}"
      COOKIE_SECRET: "${COOKIE_SECRET:?set by scripts/stack.sh}"
      CIPHER_SECRET: "${CIPHER_SECRET:?set by scripts/stack.sh}"
      COURIER_SMTP_CONNECTION_URI: smtp://mailpit:1025/?disable_starttls=true
      MAIL_FROM: no-reply@skipper-exam.local
      # "Google" is the stack's mock OpenID Connect server. It shares Kratos's
      # network, so Kratos and the browser both reach it at the same address.
      OIDC_ISSUER_URL: "http://127.0.0.1:${MOCK_OIDC_PORT:?set by scripts/stack.sh}/default"
      OIDC_CLIENT_ID: skipper-exam
      OIDC_CLIENT_SECRET: skipper-exam-secret
      KRATOS_DEV: "true"
    depends_on:
      db:
        condition: service_healthy

  kratos:
    build: docker/kratos
    command: serve
    environment: *kratos-env
    ports:
      - "127.0.0.1::4434"
      # The mock Google server listens in Kratos's network (see mock-oidc).
      - "127.0.0.1:${MOCK_OIDC_PORT:?set by scripts/stack.sh}:${MOCK_OIDC_PORT}"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4434/admin/health/ready"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Stands in for Google sign-in. It runs in Kratos's network on the reserved port,
  # so Kratos and the browser reach it at the same address, 127.0.0.1:MOCK_OIDC_PORT;
  # its tokens' issuer then matches what Kratos expects.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    network_mode: service:kratos
    environment:
      SERVER_PORT: "${MOCK_OIDC_PORT:?set by scripts/stack.sh}"
      JSON_CONFIG: '{"interactiveLogin": true}'
    depends_on:
      kratos:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1::8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/livez"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://skipper_exam:skipper_exam@db:5432/skipper_exam
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
    ports:
      - "127.0.0.1:${APP_PORT:?set by scripts/stack.sh}:8080"
    depends_on:
      db:
        condition: service_healthy
      kratos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  db:
