# The full local stack. Start it through scripts/stack.sh (or make up), which gives
# every worktree its own project name, so stacks never share containers or data.
#
# Host ports are assigned by Docker at start-up, except the app's and the fake
# sign-in service's: the app must know both addresses before it starts, so stack.sh
# reserves free ports under a lock shared by all worktrees and passes them in as
# APP_PORT and MOCK_OIDC_PORT.
services:
  db:
    image: postgres:17.2
    environment:
      POSTGRES_USER: skipper_exam
      POSTGRES_PASSWORD: skipper_exam
      POSTGRES_DB: skipper_exam
    ports:
      - "127.0.0.1::5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skipper_exam"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://skipper_exam:skipper_exam@db:5432/skipper_exam
      APP_URL: "${APP_URL:?set by scripts/stack.sh}"
      # The fake sign-in service (mock-oidc), standing in for Authentik.
      OIDC_ISSUER_URL: "http://127.0.0.1:${MOCK_OIDC_PORT:?set by scripts/stack.sh}/default"
      OIDC_CLIENT_ID: skipper-exam
      OIDC_CLIENT_SECRET: skipper-exam-secret
    ports:
      - "127.0.0.1:${APP_PORT:?set by scripts/stack.sh}:8080"
      # The fake sign-in service listens in the app's network (see mock-oidc).
      - "127.0.0.1:${MOCK_OIDC_PORT}:${MOCK_OIDC_PORT}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Stands in for esrp.ro's sign-in service (Authentik) and Google: a mock OpenID
  # Connect provider (cli/mock-oidc) where tests choose who signs in (the user ID
  # becomes "sub"), safe for parallel sign-ins.
  # It runs in the app's network on the reserved port, so the app and the browser
  # reach it at the same address, 127.0.0.1:MOCK_OIDC_PORT, and its tokens' issuer
  # matches what the app expects.
  mock-oidc:
    build:
      context: .
      dockerfile: docker/mock-oidc/Dockerfile
    network_mode: service:app
    environment:
      SERVER_PORT: "${MOCK_OIDC_PORT:?set by scripts/stack.sh}"
    depends_on:
      app:
        condition: service_started

volumes:
  db:
