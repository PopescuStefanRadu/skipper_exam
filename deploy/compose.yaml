# Production: the app at APP_URL behind your HTTPS reverse proxy (see docs/DEPLOYMENT.md).
#
#   cp env.example .env   # fill it in
#   docker compose up -d
#
# The proxy forwards every path of APP_URL's host to the app (APP_BIND, default
# 127.0.0.1:8080, or the app service over a Docker network the proxy shares).
# Nothing else is exposed. The app must reach the sign-in service (OIDC_ISSUER_URL,
# AUTHENTIK_URL) at its public address.
name: skipper-exam

services:
  db:
    image: postgres:17.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: skipper_exam
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
      POSTGRES_DB: skipper_exam
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skipper_exam"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    image: "${IMAGE_PREFIX:-ghcr.io/popescustefanradu/skipper-exam}-app:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://skipper_exam:${POSTGRES_PASSWORD}@db:5432/skipper_exam"
      APP_URL: "${APP_URL:?set in .env}"
      # Sign-in through esrp.ro's sign-in service (Authentik): this app's OAuth2/OpenID provider there.
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:?set in .env}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?set in .env}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?set in .env}"
      # Account deletion also deletes app-only users there. Leave AUTHENTIK_URL
      # empty to delete only the app's data.
      AUTHENTIK_URL: "${AUTHENTIK_URL:-}"
      AUTHENTIK_API_TOKEN: "${AUTHENTIK_API_TOKEN:-}"
      AUTHENTIK_APP_GROUP: "${AUTHENTIK_APP_GROUP:-skipper-exam}"
    ports:
      - "${APP_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 30

  # Backs up the database every night into BACKUP_DIR (docker/backup/backup.sh).
  backup:
    image: "${IMAGE_PREFIX:-ghcr.io/popescustefanradu/skipper-exam}-backup:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: skipper_exam
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
      BACKUP_HOUR: "${BACKUP_HOUR:-3}"
      TZ: "${TZ:-Europe/Bucharest}"
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
