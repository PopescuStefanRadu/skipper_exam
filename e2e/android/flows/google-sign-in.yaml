# Google sign-in: the app opens the sign-in page in the browser (the stack's mock
# Google), and Kratos sends the browser back to the app, which is then signed in.
appId: ro.skipperexam.app
---
- extendedWaitUntil:
    visible: "Autentificare"
    timeout: 20000
- tapOn: "Continuă cu Google"
- extendedWaitUntil:
    visible: "Mock OAuth2 Server Sign-in"
    timeout: 30000
- takeScreenshot: 08-google-in-browser
# The mock's form: the user (focused), then the claims Google would send.
- inputText: ${GOOGLE_EMAIL}
- pressKey: Tab
- inputText: ${GOOGLE_CLAIMS}
- hideKeyboard
- scrollUntilVisible:
    element: "Sign-in"
    direction: DOWN
- tapOn: "Sign-in"
- extendedWaitUntil:
    visible: "Pentru ce examen te pregătești?"
    timeout: 30000
- assertVisible: ${GOOGLE_EMAIL}
- takeScreenshot: 09-google-signed-in
