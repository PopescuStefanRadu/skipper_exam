# The first sign-in: "Continuă cu Google" opens the sign-in service in the browser
# (the stack's fake one), which returns to the app signed in. The new account then
# chooses its exam type and reaches the home screen.
appId: ro.skipperexam.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Autentificare"
    timeout: 30000
- takeScreenshot: 01-sign-in
- tapOn: "Continuă cu Google"
- runFlow: sign-in-at-service.yaml
- extendedWaitUntil:
    visible: "Pentru ce examene te pregătești?"
    timeout: 30000
# The web view can expose the top bar a moment after the page.
- extendedWaitUntil:
    visible: ${EMAIL}
    timeout: 15000
- tapOn: "Clasa C"
- scrollUntilVisible:
    element: "Salvează"
    direction: DOWN
- tapOn: "Salvează"
- extendedWaitUntil:
    visible: "Examen simulat"
    timeout: 20000
- scrollUntilVisible:
    element: "Toate datele sunt salvate pe server."
    direction: DOWN
- takeScreenshot: 02-home
